name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ['1.24.x', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - run: go test -race -timeout 60s ./...
      - run: go vet ./...
      - run: go build -trimpath -o wbot ./cmd/wbot
      - run: python3 tests/smoke.py ./wbot
